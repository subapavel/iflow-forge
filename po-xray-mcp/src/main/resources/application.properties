quarkus.application.name=po-xray-mcp
quarkus.banner.enabled=false

# MCP over STDIO: stdout carries the protocol, logs go to stderr (set by the extension)
quarkus.log.level=WARN
quarkus.mcp.server.server-info.name=po-xray
quarkus.mcp.server.server-info.version=0.1.0-SNAPSHOT

# one self-contained runnable jar
quarkus.package.jar.type=uber-jar
quarkus.locales=en,cs

# native image: resources of po-xray-core (built-in function catalog, document labels)
quarkus.native.resources.includes=io/poxray/**/*.json,io/poxray/**/*.properties

# reflection registration of the output model (po-xray-native, @RegisterForReflection) is found through the index
quarkus.index-dependency.poxray-native.group-id=io.poxray
quarkus.index-dependency.poxray-native.artifact-id=po-xray-native

# native image: HTTPS to PO systems (off by default in native builds) and a portable CPU baseline (cloud PCs)
quarkus.ssl.native=true
quarkus.native.additional-build-args=-march=compatibility
